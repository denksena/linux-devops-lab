services:

  app:
    build: ./app
    container_name: flask-app

    ports:
      - "5000:5000"

  postgres:
    image: postgres:16

    container_name: postgres-db

    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb

    ports:
      - "5433:5432"
