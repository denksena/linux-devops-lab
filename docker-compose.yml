services:

  app:
    build: ./app
    container_name: flask-app
    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      DB_HOST: postgres
      DB_NAME: devdb
      DB_USER: devuser
      DB_PASSWORD: devpass

  postgres:
    image: postgres:16
    restart: unless-stopped

    container_name: postgres-db

    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb

    ports:
      - "5433:5432"

    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U devuser -d devdb"]
     interval: 5s
     timeout: 5s
     retries: 5
     start_period: 10s
